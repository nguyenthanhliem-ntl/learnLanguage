# Cấu hình môi trường thật (bật bằng SPRING_PROFILES_ACTIVE=prod, Dockerfile đã đặt sẵn).
# Mọi thông tin bí mật lấy từ biến môi trường: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET.

server:
  # Chạy sau Nginx: đọc X-Forwarded-* để biết đúng địa chỉ/scheme người dùng truy cập
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

app:
  cors:
    # Địa chỉ người dùng mở web, vd http://1.2.3.4 (đặt bằng APP_CORS_ALLOWED_ORIGINS, nhiều địa chỉ cách nhau dấu phẩy)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}

# Tắt Swagger UI và API docs trên môi trường thật
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
