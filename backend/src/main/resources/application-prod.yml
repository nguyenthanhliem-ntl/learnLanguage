# Production settings (enabled with SPRING_PROFILES_ACTIVE=prod, already set in the Dockerfile).
# All secrets come from environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET.

server:
  # Behind Nginx: read X-Forwarded-* to know the real address/scheme the user used
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

app:
  cors:
    # Address users open the site at, e.g. http://1.2.3.4 (set via APP_CORS_ALLOWED_ORIGINS, comma-separated for several)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}

# Disable Swagger UI and API docs in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
