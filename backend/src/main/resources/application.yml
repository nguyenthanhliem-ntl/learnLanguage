spring:
  application:
    name: vocab-backend
  # Load environment variables from backend/.env if present (this file is not committed)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is managed by Flyway, Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          batch_size: 50      # used for batched Excel import
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 1440
  cors:
    allowed-origins: http://localhost:5173
  zone: Asia/Ho_Chi_Minh

springdoc:
  swagger-ui:
    path: /swagger-ui.html
