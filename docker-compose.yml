# VocabMaster - môi trường thật: Oracle Free + backend Spring Boot + Nginx (frontend).
# Biến bí mật đặt trong file .env cùng thư mục (copy từ deploy/env.example, KHÔNG commit).
# Chạy: docker compose up -d --build     Xem log: docker compose logs -f backend

services:
  db:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:?Thiếu ORACLE_ADMIN_PASSWORD trong .env}
      APP_USER: ${DB_USERNAME:?Thiếu DB_USERNAME trong .env}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    # Không mở cổng DB ra ngoài; chỉ backend trong mạng Docker kết nối được

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:oracle:thin:@//db:1521/FREEPDB1
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Thiếu PUBLIC_URL trong .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  oracle-data:
