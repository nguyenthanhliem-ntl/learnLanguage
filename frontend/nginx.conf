# Nginx for VocabMaster: serves the frontend (SPA) and proxies /api to the backend.

# Rate limit for login / sign-up: at most 10 per minute per IP (against password guessing)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Excel import up to 5MB (the backend allows 6MB for the whole request)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Vite build files have a hash in their names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: every other path (e.g. /practice, /words) returns index.html for Vue Router to handle
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
