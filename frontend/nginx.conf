# Nginx cho VocabMaster: phục vụ frontend (SPA) và chuyển /api sang backend.

# Giới hạn đăng nhập / đăng ký: tối đa 10 lần mỗi phút cho mỗi IP (chống dò mật khẩu)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Import Excel tối đa 5MB (backend giới hạn 6MB cho cả request)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # File build của Vite có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác (vd /practice, /words) trả về index.html để Vue Router xử lý
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
